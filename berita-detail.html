<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detail Berita - Kampung Bahari</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .detail-wrapper {
    max-width: 860px;
    margin: 100px auto 60px;
    padding: 0 24px;
  }
  .btn-back {
    display: inline-flex; align-items: center; gap: 8px;
    background: #0077b6; color: #fff;
    padding: 10px 20px; border-radius: 6px;
    font-size: 14px; font-weight: 600;
    text-decoration: none; margin-bottom: 28px;
    transition: background .2s;
  }
  .btn-back:hover { background: #023e8a; }
  .detail-card {
    background: #fff;
    border-radius: 14px;
    box-shadow: 0 2px 16px rgba(0,0,0,0.08);
    padding: 40px;
  }
  .detail-date {
    font-size: 13px; color: #888;
    display: flex; align-items: center; gap: 6px;
    margin-bottom: 12px;
  }
  .detail-title {
    font-size: 28px; font-weight: 800;
    color: #023e8a; line-height: 1.3;
    margin-bottom: 24px;
  }
  .detail-img {
    width: 100%; border-radius: 10px;
    object-fit: cover; max-height: 420px;
    margin-bottom: 24px;
  }
  .detail-body {
    font-size: 15px; color: #444;
    line-height: 1.85;
  }
  .detail-body p { margin-bottom: 16px; }
</style>
</head>
<body>

<!-- NAV -->
<nav>
  <a class="nav-brand" href="index.html">
    <span>🐟</span> Kampung Bahari
  </a>
  <ul class="nav-links">
    <li><a href="index.html#home">Beranda</a></li>
    <li><a href="index.html#produk">Produk Warga</a></li>
    <li><a href="index.html#berita">Kegiatan</a></li>
    <li><a href="index.html#peta">Peta</a></li>
    <li><a href="index.html#kontak">Kontak</a></li>
  </ul>
</nav>

<div class="detail-wrapper">
  <a href="index.html#berita" class="btn-back">← Kembali ke Beranda</a>

  <div class="detail-card" id="detail-content">
    <!-- Konten diisi oleh JS berdasarkan ?id= di URL -->
  </div>
</div>

<footer>
  <div class="footer-brand">
    <div class="brand-name">🐟 Kampung Bahari</div>
    <p>Membangun ekonomi pesisir dari kekayaan laut nusantara.</p>
  </div>
  <div class="footer-links">
    <h4>Tautan</h4>
    <ul>
      <li><a href="index.html#home">Beranda</a></li>
      <li><a href="index.html#produk">Produk</a></li>
      <li><a href="index.html#berita">Kegiatan</a></li>
      <li><a href="index.html#kontak">Admin</a></li>
    </ul>
  </div>
</footer>
<div class="footer-bottom">© 2026 Warga Kampung Bahari.</div>

<script>
const beritaData = {
  "1": {
    tanggal: "10 Mei 2024",
    judul: "Pelatihan Pengolahan Hasil Laut",
    img: "https://images.unsplash.com/photo-1578662996442-48f60103fc96?w=900&q=80",
    imgAlt: "Pelatihan Pengolahan Ikan",
    isi: [
      "Kelompok nelayan dan ibu-ibu PKK Kampung Bahari antusias mengikuti pelatihan pengolahan hasil laut yang diselenggarakan bekerja sama dengan Dinas Kelautan dan Perikanan setempat.",
      "Pelatihan ini berfokus pada teknik pengolahan ikan menjadi produk bernilai jual tinggi seperti abon ikan, kerupuk udang, dan sambal ikan cakalang. Para peserta diajarkan cara pengemasan higienis dan pelabelan produk agar siap dipasarkan secara online maupun offline.",
      "Kegiatan ini diharapkan dapat meningkatkan pendapatan warga Kampung Bahari dan membuka peluang pasar yang lebih luas bagi produk hasil laut lokal. Ke depannya, pelatihan serupa akan diadakan secara rutin setiap tiga bulan sekali."
    ]
  },
  "2": {
    tanggal: "22 April 2024",
    judul: "Gotong Royong Bersih Pantai",
    img: "https://images.unsplash.com/photo-1559827260-dc66d52bef19?w=900&q=80",
    imgAlt: "Bersih Pantai Kampung Bahari",
    isi: [
      "Warga Kampung Bahari bersama relawan lingkungan dan kelompok nelayan menggelar aksi gotong royong bersih pantai dalam rangka memperingati Hari Bumi sekaligus menjaga kebersihan kawasan pesisir.",
      "Ratusan kilogram sampah plastik dan berbagai limbah berhasil dikumpulkan dari sepanjang garis pantai Kampung Bahari. Kegiatan ini melibatkan warga dari berbagai RT, mulai dari anak-anak sekolah dasar hingga para lansia yang tetap bersemangat.",
      "Ketua RT setempat menyampaikan bahwa kebersihan pantai adalah tanggung jawab bersama yang berdampak langsung pada kualitas hasil tangkapan laut. Program bersih pantai ini akan dijadikan agenda rutin bulanan Kampung Bahari."
    ]
  }
};

function getParam(key) {
  return new URLSearchParams(window.location.search).get(key);
}

const id = getParam('id') || '1';
const data = beritaData[id];
const container = document.getElementById('detail-content');

if (data) {
  container.innerHTML = `
    <div class="detail-date">📅 ${data.tanggal}</div>
    <h1 class="detail-title">${data.judul}</h1>
    <img class="detail-img" src="${data.img}" alt="${data.imgAlt}">
    <div class="detail-body">
      ${data.isi.map(p => `<p>${p}</p>`).join('')}
    </div>
  `;
} else {
  container.innerHTML = '<p>Berita tidak ditemukan.</p>';
}
</script>
</body>
</html>
